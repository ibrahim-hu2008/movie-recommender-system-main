<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/345d4d2f08.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  <title>Login Page</title>

  <style>
    body {
        margin: 0;
        height: 100%;
        font-family: "Nunito", sans-serif;
        font-weight: 600;
        color: white;
        background-image: url('static/images/background.png');
        background-size: cover;
        background-attachment: fixed; 
        background-repeat: no-repeat;
        background-position: center;
    }

    .wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0 auto;
        gap: 1.3rem;
        width: 1000px;
        position: relative;

    }

    .navigation-div {
        margin-top: 5px;
        display: flex;
        flex-direction: row;
        width: 100%;
        height: 106px;
        background-color: transparent;
        position: sticky;
        z-index: 1000;
        top: 0;
    }

    .color-block {
        height: 115px;
        width: 100%;
        background-color: #16162b;
        z-index: 5;
        position: fixed;
    }

    .navigation-div a {
        float: left;
        color: #f2f2f2;
        text-align: center;
        padding: 8px 10px;
        text-decoration: none;
        font-size: 15px;
        margin-top: 30px;
        margin-left: 40px;
        height: 20px;
    }

    .navigation-div a:hover {
        background-color: rgba(84,121,255, 0.3);
        border-radius: 7px;
    }

    .navigation-div a:active {
        opacity: 0.7;
    }


    .logo {
        width: 70px;
        height: 75px;
        padding: 10px 10px;
        background-image: url('static/images/asfc-logo.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
    }

     .profile-icon {
        width: 60px;
        height: 60px;
        margin-top: 10px;
        margin-left: 200px;
        padding: 10px 10px;
        background-image: url('static/images/profile-icon.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        filter: invert(100%);
        cursor: pointer;
    }

    .profile-icon:hover {
        filter: invert(0%);
        background-color: rgb(84, 121, 255);
        border-radius: 10px;
    }

    .profile-icon:active {
        opacity: 0.7;
    }

    .search-icon {
        width: 10px;
        height: 10px;
        margin-left: 40px;
        margin-top: 30px;
        padding: 10px 10px;
        background-image: url('static/images/magnifying-glass-solid.svg');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        filter: invert(100%);
        cursor: pointer;
    }

    .search-icon:hover {
        filter: invert(0);
        background-color: rgb(84, 121, 255);
        border-radius: 8px;
    }

    .search-icon:active {
        opacity: 0.7;
    }

    .main-content {
        display: flex;
        flex-direction: column;
        width: 1000px;
        height: 800px;
        gap: 1.5rem;
    }

    .title-div {
        width: 1000px;
        height: 200px;
        display: flex;
        flex-direction: row;
        gap: 2rem;
    }

    .movie-poster {
        height: 200px;
        width: 140px;
        background-image: url('static/images/movie-poster.jpg');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
    }

    .title-para {
        font-size: 35px;
        color: white;
        font-weight: 700;
        margin: 0;
    }

    .question-area {
        width: 1000px;
        height: 400px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .question {
        width: 950px;
        height: 30px;
        padding: 10px;
        border: 2px solid rgb(84, 121, 255);
    }

    .answer-set {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 500px;
        height: 300px;
    }

    .answer {
        border-radius: 10px;
        width: 500px;
        height: 75px;
        background-color: rgba(22, 22, 43, 0.8);
        padding: 5px;
        font-weight: 700;
    }

    .answer p {
        margin-left: 30px;
        width: 400px;
        transition: all 0.2s;
    }

    .answer p:hover {
        background-color: rgba(84,121,255, 0.3);
        border-radius: 5px;
        padding: 5px;
        cursor: pointer;
    }

    .answer p:active {
        background-color: rgba(84,121,255, 0.6);
    }

    .button { 
        height: 40px;
        width: 460px;
        color: white;
        border-style: solid;
        border-color: rgb(84,121,255);
        background-color: rgb(84,121,255);
        border-radius: 3px;
        font-size: 20px;
        text-decoration: none;
        font-weight: 700;
        cursor: pointer;
        margin-top: 25px;
    }

    .button:hover {
        background-color: rgb(44, 88, 248);
    }

    .button:active {
        opacity: 0.7;
    }
    
  </style>
</head>

<body>

    <div class="background"> <!-- grey-blue gradient bg -->
        <div class="wrapper"> <!-- wrapper that allows white space on sides -->
        <nav class="navigation-div"> <!-- navigation bar containing links and icons-->
            <div class="logo"></div>
            <a href="/homepage">Home</a>
            <a class='active'>Profile</a>
            <a href="/classpage">Class</a>
            <a href="/watchlist">Watchlist</a>
            <div class="profile-icon"></div>
            <div class="search-icon"></div>
        </nav>   
        <div class="color-block"></div> 

        <div class='main-content'>
            <div class="title-div">
                <div class="movie-poster"></div>
                <div class="title">
                    <p class="title-para">Title (Year)</p>
                    <p>Quiz: Film Form Techniques</p>
                </div>
            </div>
            <div class="question-area">
                <div class="question">
                    <span style="font-weight: 700; color: rgb(84, 121, 255);">Question 1: </span>What camera technique in Vertigo is used to convey Scottie's acrophobia?
                </div>
                <div class="answer-set">
                    <div class="answer">
                        <p>Option A</p>
                    </div>
                    <div class="answer">
                         <p>Option B</p>
                    </div>
                    <div class="answer">
                         <p>Option C</p>
                    </div>
                    <div class="answer">
                         <p>Option D</p>
                    </div>
                </div>
                <button class="button">Submit</button>
            </div>
        </div>
        </div>
    </div>


</body>
</html>
